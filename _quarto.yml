project:
  type: website
  render:
    - "*.qmd"
    - "!refs/"

website:
  title: "Hoeller Lab"
  description: "Hoeller Lab — research group website"
  # Canonical address. The same build is also served at https://hoellerlab.github.io;
  # _deploy/deploy-nd.ps1 copies it to the ND server.
  site-url: https://academicweb.nd.edu/hoellerlab/
  navbar:
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: people/index.qmd
        text: People
      - href: publications.qmd
        text: Publications
      - href: code-data.qmd
        text: Code & Data
      - href: join.qmd
        text: Join us
      - href: contact.qmd
        text: Contact
    right:
      - icon: github
        href: https://github.com/hoellerlab
        aria-label: GitHub
  page-footer:
    left: "© 2026 Hoeller Lab"
    right: "Made with [Quarto](https://quarto.org)"

format:
  html:
    theme: [cosmo, styles.scss]
    toc: false
    link-external-newwindow: true
    canonical-url: true
